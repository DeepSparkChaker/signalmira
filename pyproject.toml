[project]
name = "signalmira"
version = "0.2.0"
description = "Lightweight feedback ingestion and PostgreSQL persistence"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "lingua-language-detector>=2.2.0",
    "pgvector>=0.5.1",
    "sentence-transformers>=3.0",
    "transformers>=4.51.0",
    "numpy>=2.5.4",
]

[project.optional-dependencies]
ner = [
    "gliner2[local]>=2.1.0",
    "huggingface-hub>=2.3.0",
    "psycopg[binary]>=3.3.6",
    "spacy>=3.8.18",
]
topics = [
    "bertopic>=0.17.4",
    "jieba>=0.42.1",
    "sentence-transformers>=6.2.0",
    "stopwordsiso>=0.7.1",
    "umap-learn>=0.5.12",
]
ui = [
    "streamlit>=1.48,<2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
